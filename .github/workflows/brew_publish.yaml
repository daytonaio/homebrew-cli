name: Update brew with new versions
# The run title carries the version so the dispatching publish job can find
# and await ITS run by title (never by clock).
run-name: Update brew daytona to ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [update-version]

concurrency:
  group: brew-stable-formula
  cancel-in-progress: false

jobs:
  update-brew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Bash script with version argument
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Ensure a version argument is provided
          if [ -z "$VERSION" ]; then
            echo "Please provide a version number as an argument."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable version '$VERSION'. Expected vX.Y.Z." >&2
            exit 1
          fi
          echo "Received version: $VERSION"
          bash scripts/update_sha.sh "$VERSION" daytona.rb
      - name: Commit ${{ github.event.client_payload.version }}
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          file_pattern: "daytona.rb"
          branch: master
          commit_message: Automated file update to - ${{ github.event.client_payload.version }}
