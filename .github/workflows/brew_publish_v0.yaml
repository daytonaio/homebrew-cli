name: Update brew daytona@0 with new versions
run-name: Update brew daytona@0 to ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [update-version-v0]

concurrency:
  group: brew-v0-formula
  cancel-in-progress: false

jobs:
  update-brew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The tip of master, not the commit the dispatch event was created
        # on: a run that waited behind another one must build on its update.
        with:
          ref: master
          fetch-depth: 0
      - name: Run Bash script with version argument
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Ensure a version argument is provided
          if [ -z "$VERSION" ]; then
            echo "Please provide a version number as an argument."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid 0.x version '$VERSION'. Expected v0.X.Y." >&2
            exit 1
          fi
          echo "Received version: $VERSION"
          bash scripts/update_sha.sh "$VERSION" daytona@0.rb
      - name: Commit ${{ github.event.client_payload.version }}
        env:
          VERSION: ${{ github.event.client_payload.version }}
        # Rebases and retries when another formula's update landed first.
        run: bash scripts/commit_formula.sh "daytona@0.rb" "Automated file update to - $VERSION"
