name: Update brew daytona@0 with new versions
run-name: Update brew daytona@0 to ${{ github.event.client_payload.version }}

on:
  repository_dispatch:
    types: [update-version-v0]

concurrency:
  group: brew-v0-formula
  cancel-in-progress: false

jobs:
  update-brew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Bash script with version argument
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          # Ensure a version argument is provided
          if [ -z "$VERSION" ]; then
            echo "Please provide a version number as an argument."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v0\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid 0.x version '$VERSION'. Expected v0.X.Y." >&2
            exit 1
          fi
          echo "Received version: $VERSION"
          bash scripts/update_sha.sh "$VERSION" daytona@0.rb
      - name: Commit ${{ github.event.client_payload.version }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "daytona@0.rb"
          commit_message: Automated file update to - ${{ github.event.client_payload.version }}
